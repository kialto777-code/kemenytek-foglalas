<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Időpontfoglalás - Kéményseprő ellenőrzés</title>
<style>
  :root { --zold:#2f9e44; --kek:#1f6feb; --szurke:#6b7280; --bg:#f4f6f8; --kartya:#fff; --border:#e2e6ea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:#1f2933; line-height:1.5; }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 48px; }
  header h1 { font-size:1.35rem; margin:.2em 0 .1em; }
  header p { margin:.1em 0; color:var(--szurke); font-size:.95rem; }
  .cim { font-weight:600; color:#1f2933; }
  h2 { font-size:1.05rem; margin:1.6em 0 .6em; }
  .slot { display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--kartya); border:1.5px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:12px; cursor:pointer; font-size:1rem; transition:.12s;
    -webkit-tap-highlight-color:transparent; }
  .slot:active { transform:scale(.99); }
  .slot .ic { width:44px; height:44px; border-radius:50%; flex:0 0 auto; display:flex;
    align-items:center; justify-content:center; font-size:1.3rem; color:#fff; }
  .slot.de .ic { background:#f59f00; }
  .slot.du .ic { background:var(--kek); }
  .slot .fo { font-weight:600; }
  .slot .al { color:var(--szurke); font-size:.9rem; }
  .slot .idot { margin-left:auto; font-size:1.25rem; font-weight:700; }
  .nap-cim { font-weight:600; margin:1.1em 0 .4em; font-size:.95rem; color:#334; }
  .szombatdij { background:#fff4e5; border:1px solid #f0b27a; border-radius:8px;
    padding:8px 11px; margin:0 0 .6em; font-size:.88rem; line-height:1.45; color:#7a4a12; }
  .idok { display:flex; flex-wrap:wrap; gap:8px; }
  .idok button { background:var(--kartya); border:1.5px solid var(--border); border-radius:10px;
    padding:10px 13px; font-size:1rem; cursor:pointer; }
  .idok button:active { border-color:var(--kek); }
  /* Honap-naptar */
  .honap { background:var(--kartya); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:12px; }
  .honap h3 { text-align:center; font-size:1rem; margin:.2em 0 .6em; }
  .rács { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .fejnap { text-align:center; font-size:.72rem; color:var(--szurke); padding:2px 0; font-weight:600; }
  .nap { aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative;
    border-radius:9px; font-size:.9rem; color:#cbd2d9; }
  .nap.mas { color:#e5e9ec; }
  .nap.hetvege { color:#c0392b33; }
  .nap.szabad { color:#1f2933; background:#e8f0fb; font-weight:600; cursor:pointer; }
  .nap.szabad::after { content:''; position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:var(--kek); }
  .nap.ajanlott { background:var(--kek); color:#fff; }
  .nap.ajanlott::after { background:#fff; }
  .nap.valasztott { outline:2px solid var(--kek); outline-offset:-2px; }
  .naplegend { font-size:.75rem; color:var(--szurke); text-align:center; margin-top:8px; }
  .hidden { display:none; }
  .allapot { text-align:center; padding:40px 12px; color:var(--szurke); }
  /* LATHATO VARAKOZAS (Fonok 2026-08-12 23:17: "eleg sokat" vart, es a nema
     "Betoltes..." felirat romlasnak nezett ki). A lap EGY hivasra var, ami
     1,8-1,9 masodperc (haromszor merve az eles uton), mert a szerver minden
     megnyitasnal lekerdezi a naptarat. Ez nem hiba, de nema varakozaskent annak
     latszik -- ezert forog egy karika, es oda van irva, mennyire szamitson. */
  .porgo { width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
    border:3px solid #dfe3e8; border-top-color:var(--kek); animation:porog .9s linear infinite; }
  @keyframes porog { to { transform:rotate(360deg); } }
  .allapot .kicsi { font-size:.82rem; opacity:.75; margin-top:6px; }
  .siker { text-align:center; padding:30px 16px; }
  .siker .pipa { width:64px; height:64px; border-radius:50%; background:var(--zold); color:#fff;
    font-size:2rem; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .siker h2 { color:var(--zold); }
  .lab { font-size:.8rem; color:var(--szurke); text-align:center; margin-top:28px; }
  .hiba { color:#e5484d; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="allapot"><div class="porgo"></div>Szabad időpontok keresése
    <div class="kicsi">Ez néhány másodpercig tart, a naptár épp frissül.</div></div></div>
  <p class="lab">Kéményseprő időpont-egyeztetés &middot; a kötelező éves ellenőrzéshez</p>
</div>
<script>
const NAPOK = ['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
const HONAP = ['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
const app = document.getElementById('app');
// EZ A LAP KET HELYROL IS JON (2026-08-04, Fonok: a foglalo is a sajat cimen legyen):
//   1. a foglalo szerverrol magarol (ts.net funnel) -- ott az adat relativ uton megy,
//   2. a sajat domainrol, statikus tarhelyrol (foglalas.kemenytek.hu) -- onnan viszont
//      az adatnak at kell mennie a foglalo-rendszerhez, ami Fonok gepen fut.
// A mar KIKULDOTT 102 ugyfellink az 1. uton jon, es valtozatlanul mukodik.
// 2026-08-11: AZ API-CIM ATKERULT a ts.net-es nevrol az api.kemenytek.hu-ra.
// MIERT: a ts.net-es cim a NYILVANOS internetrol nem valaszolt (a kapcsolat felepult,
// de a TLS-kezfogasra nulla bajt jott vissza). A lap betoltott, az urlap megjelent, a
// bekuldes viszont sehova nem erkezett meg. Merve 2026-08-11: 350 kikuldott meghivo
// utan NULLA valodi foglalas jott be ezen az uton, es a tablaban csak augusztus 4-i
// TESZT-sorok alltak. Nem tudunk egyetlen pillanatot sem mutatni, amikor mukodott.
// Az api.kemenytek.hu egy nyilvanos szerveren all, es az a gep adja tovabb a kerest a
// zart halozaton Fonok gepere. AZ ADAT NEM MOZDULT: az adatbazis tovabbra is ott van,
// es a foglalo-szolgaltatas tovabbra is csak 127.0.0.1-en hallgat.
const API = location.hostname.endsWith('kemenytek.hu')
  ? 'https://api.kemenytek.hu'
  : '';
const params = new URLSearchParams(location.search);
const id = params.get('id');
const token = params.get('token');           // ugyfel-oldal: biztonsagos link
const slotQuery = token ? `token=${encodeURIComponent(token)}` : `ugyfel_id=${id}`;
const scanParam = params.get('scan');
const scan = scanParam && /^\d+$/.test(scanParam) ? scanParam : '30';

function fmtNap(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}. ${HONAP[d.getMonth()]} ${d.getDate()}., ${NAPOK[d.getDay()]}`;
}
function fmtIdo(iso) { const d = new Date(iso); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }

async function init() {
  if (!token && (!id || !/^\d+$/.test(id))) { app.innerHTML = '<div class="allapot hiba">Hibás foglalási link.</div>'; return; }
  let data;
  try {
    const r = await fetch(`${API}/api/javasolt-slotok?${slotQuery}&scan=${scan}`);
    data = await r.json();
    if (data.error) throw new Error(data.error);
  } catch (e) { app.innerHTML = '<div class="allapot hiba">Nem sikerült betölteni az időpontokat. Kérjük, próbálja később.</div>'; return; }
  render(data);
}

let AVAIL = {};      // "YYYY-MM-DD" -> [slot,...]
let AJANLOTT = new Set(); // ajanlott napok datum-stringje
let UGYFEL = {};     // az ugyfel adatai (cim a naptar-esemenyhez)

function icsHref(iso) {
  const p = n => String(n).padStart(2, '0');
  const f = x => `${x.getFullYear()}${p(x.getMonth() + 1)}${p(x.getDate())}T${p(x.getHours())}${p(x.getMinutes())}00`;
  const d = new Date(iso), end = new Date(d.getTime() + 30 * 60000);
  const loc = (UGYFEL.cim || '').replace(/[,;\\]/g, ' ');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PestiKemeny//HU', 'BEGIN:VEVENT',
    `UID:${d.getTime()}@pestikemeny`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(d)}`, `DTEND:${f(end)}`,
    'SUMMARY:Kéményseprő ellenőrzés', `LOCATION:${loc}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}

  const u = data.ugyfel || {};
  UGYFEL = u;

function slotCard(cls, ic, cim, s) {
  return `<button class="slot ${cls}" data-iso="${s.iso}">
    <span class="ic">${ic}</span>
    <span><span class="fo">${cim}</span><br><span class="al">${fmtNap(s.iso)}</span></span>
    <span class="idot">${fmtIdo(s.iso)}</span></button>`;
}

function renderNaptar() {
  const napok = Object.keys(AVAIL).sort();
  if (!napok.length) return;
  // Honapok az elso szabad naptol az utolsoig
  const first = new Date(napok[0] + 'T00:00'), last = new Date(napok[napok.length - 1] + 'T00:00');
  let y = first.getFullYear(), m = first.getMonth();
  let html = '';
  while (y < last.getFullYear() || (y === last.getFullYear() && m <= last.getMonth())) {
    html += honapHtml(y, m);
    m++; if (m > 11) { m = 0; y++; }
  }
  html += `<p class="naplegend">🔵 szabad nap &middot; kék háttér = Önnek ajánlott</p>`;
  document.getElementById('naptar').innerHTML = html;
  document.querySelectorAll('.nap.szabad').forEach(el => el.onclick = () => mutatNap(el.dataset.d));
}

function honapHtml(y, m) {
  const first = new Date(y, m, 1);
  let start = first.getDay() - 1; if (start < 0) start = 6; // hetfovel kezdunk
  const napok = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < start; i++) cells += `<div class="nap mas"></div>`;
  for (let d = 1; d <= napok; d++) {
    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dow = new Date(y, m, d).getDay();
    let cls = 'nap';
    if (AVAIL[iso]) cls += AJANLOTT.has(iso) ? ' szabad ajanlott' : ' szabad';
    else if (dow === 0 || dow === 6) cls += ' hetvege';
    cells += `<div class="${cls}" data-d="${iso}">${d}</div>`;
  }
  return `<div class="honap"><h3>${y}. ${HONAP[m]}</h3>
    <div class="rács">${['H','K','Sze','Cs','P','Szo','V'].map(x => `<div class="fejnap">${x}</div>`).join('')}${cells}</div></div>`;
}

function mutatNap(datum) {
  document.querySelectorAll('.nap.valasztott').forEach(e => e.classList.remove('valasztott'));
  const cell = document.querySelector(`.nap[data-d="${datum}"]`);
  if (cell) cell.classList.add('valasztott');
  const slots = AVAIL[datum] || [];
  const el = document.getElementById('napreszlet');
  // SZOMBATI KISZALLASI DIJ (Fonok szabalya 2026-08-14). Az elso keres ugy szolt, hogy a
  // MEGHIVO LEVELBE kerüljon -- de a levelben 2026-08-12 ota nincs idopont-gomb, az ugyfel
  // ITT valaszt napot. Ezert a mondat oda kerul, ahol a dontes szuletik, es Fonok a merest
  // latva pontositott: "az e-mailben nem kell, eleg csak a foglalolapon", es "osszeget nem
  // kell beleirni" (a dij merlegeles kerdese, ezert nincs benne szam).
  const szombat = new Date(datum + 'T00:00').getDay() === 6;
  el.innerHTML = `<div class="nap-cim">${fmtNap(datum + 'T00:00')}</div>`
    + (szombat ? `<div class="szombatdij">Szombaton kiszállási díj kerülhet felszámításra.</div>` : '')
    + `<div class="idok">`
    + slots.map(s => `<button data-iso="${s.iso}">${fmtIdo(s.iso)}</button>`).join('') + `</div>`;
  el.querySelectorAll('button').forEach(b => b.onclick = () => foglal(b.dataset.iso));
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function foglal(iso) {
  if (!confirm(`Lefoglalja ezt az időpontot?\n\n${fmtNap(iso)} ${fmtIdo(iso)}`)) return;
  app.innerHTML = '<div class="allapot"><div class="porgo"></div>Foglalás rögzítése</div>';
  try {
    // Ugyfel-oldal (token): biztonsagos foglalo-vegpont + email-visszaigazolas.
    // Admin/teszt (id): a meglevo PATCH.
    const r = token
      ? await fetch(`${API}/api/foglalas`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, iso }) })
      : await fetch(`/api/ugyfelek/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idopont: iso }) });
    if (!r.ok) {
      // A szerver uzenetet mutatjuk (pl. utkozes), ne a general "nem sikerult".
      let m = 'hiba';
      try { m = (await r.json()).error || m; } catch {}
      throw new Error(m);
    }
    app.innerHTML = `<div class="siker"><div class="pipa">✓</div>
      <h2>Időpont lefoglalva</h2>
      <p>${fmtNap(iso)}<br><strong>${fmtIdo(iso)}</strong></p>
      <a class="slot" href="${icsHref(iso)}" download="kemenysepro-idopont.ics"
         style="justify-content:center;text-decoration:none;color:var(--kek);margin-top:14px">📅 Mentés a naptáramba</a>
      <p style="color:var(--szurke)">Köszönjük! A megadott időpontban érkezünk. Ha módosítani szeretne, keressen minket.</p>
      <div id="telefonblokk" style="background:#fff4e5;border:2px solid #ec6a1e;border-radius:10px;padding:14px 16px;margin-top:14px;text-align:left;line-height:1.55">
        <strong style="font-size:17px">Kérjük, adja meg a telefonszámát</strong><br>
        <span style="display:block;margin-top:6px">Az időpont már foglalva van, ez nem befolyásolja.
        A szám arra az egy esetre kell, amikor a kolléga <strong>kint áll a kapuban, és nem szól
        a csengő</strong> vagy nem hallják meg. Ilyenkor egy hívás megmenti a látogatást, e-mailben
        viszont már nem érnénk el időben, és a kiszállás kárba megy.</span>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <input id="telefonmezo" type="tel" inputmode="tel" autocomplete="tel"
                 placeholder="+36 20 123 4567"
                 style="flex:1 1 180px;min-width:0;padding:12px;border:1px solid #ec6a1e;border-radius:8px;font-size:16px">
          <button id="telefongomb" type="button"
                  style="padding:12px 20px;border:0;border-radius:8px;background:#ec6a1e;color:#fff;font-weight:700;font-size:16px">Megadom</button>
        </div>
        <div id="telefonuzenet" style="margin-top:8px;color:var(--szurke,#5f6368)"></div>
        <button id="telefonnem" type="button"
                style="margin-top:10px;padding:0;border:0;background:none;color:#8a8a8a;font-size:13px;text-decoration:underline;cursor:pointer">Nem szeretnék telefonszámot megadni</button>
      </div>
      <p style="background:#fff8e1;border:1px solid #f0d68a;border-radius:10px;padding:12px 14px;margin-top:14px;text-align:left;line-height:1.5">
        <strong>Egy kérésünk a látogatás előtt:</strong><br>
        Kérjük, keresse elő a <strong>tavalyi vizsgálati tanúsítványt</strong>, és tartsa kéznél.
        Sokat gyorsít az ellenőrzésen, ha a kolléga látja a korábbi eredményt.
        Ha nem találja, nem baj, attól még el tudjuk végezni a munkát.
      </p></div>`;
    // A TELEFON-BLOKK CSAK TOKENES (ugyfel-oldali) foglalasnal el: az admin/teszt
    // agnak nincs tokenje, es nem is az ugyfel ul elotte. Ha nincs, kivesszuk --
    // jobb, ha nincs ott, mint ha ott lenne es ne csinalna semmit.
    const tblokk = document.getElementById('telefonblokk');
    if (!token) { if (tblokk) tblokk.remove(); }
    else {
      const mezo = document.getElementById('telefonmezo');
      const gomb = document.getElementById('telefongomb');
      const uzen = document.getElementById('telefonuzenet');
      const kuld = async () => {
        const ertek = mezo.value.trim();
        if (!ertek) { mezo.focus(); return; }
        gomb.disabled = true; uzen.textContent = 'Mentés…';
        try {
          const rr = await fetch(`${API}/api/telefon`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, telefon: ertek }) });
          if (!rr.ok) { let m = 'nem sikerült'; try { m = (await rr.json()).error || m; } catch {} throw new Error(m); }
          // A MEZoT ES A GOMBOT ELTUNTETJUK: enelkul ugy nez ki, mintha megegyszer
          // meg kellene adni, es a masodik kuldes felulirna a sajat szamat.
          tblokk.innerHTML = '<strong>Köszönjük, feljegyeztük a telefonszámát.</strong><br>' +
            'Csak akkor hívjuk, ha a látogatással kapcsolatban közbejön valami.';
        } catch (err) {
          gomb.disabled = false;
          uzen.textContent = err.message;
        }
      };
      gomb.onclick = kuld;
      mezo.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') kuld(); });
      // A "NEM SZERETNEK MEGADNI" NEM DISZ, HANEM A LENYEG (2026-08-13).
      // Az idopont EKKOR MAR LE VAN FOGLALVA, tehat a telefonszam kerese semmit nem
      // kockaztat -- ezert lehet erosen kerni. A kilepesi lehetoseg viszont KELL:
      // enelkul aki nem akarja megadni, csak OTTHAGYJA a lapot, es akkor sem szamot
      // nem kapunk, sem azt nem tudjuk meg, hogy szandekosan nem adott.
      // Igy a "nincs szam" ket kulon allapotra valik szet: NEM KERTUK MEG rendesen,
      // vagy MEGKERTUK ES NEMET MONDOTT. A masodikra nem kell utolag ravadaszni.
      const nemGomb = document.getElementById('telefonnem');
      if (nemGomb) nemGomb.onclick = () => {
        tblokk.innerHTML = '<strong>Rendben, telefonszám nélkül is jövünk.</strong><br>' +
          'Egy kérésünk: az időpont napján figyeljen a csengőre. Ha nem tudunk bejutni, ' +
          'a látogatást csak új időpontban tudjuk pótolni.';
        tblokk.style.background = '#f4f4f4';
        tblokk.style.border = '1px solid #ddd';
      };
    }
  } catch (e) {
    app.innerHTML = `<div class="allapot hiba">${esc(e.message)}<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#fff;font-weight:600">Új időpont választása</button></div>`;
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
init();
</script>
